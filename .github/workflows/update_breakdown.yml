name: Update Breakdown Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest scripts.test_scoring
      - run: python scripts/fetch_current.py
      - run: python scripts/fetch_breakdown.py
      - run: python scripts/build_data_manifest.py
      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "Auto update breakdown data"
          file_pattern: "data/current.json data/breakdown.json data/breakdown/*.json data/manifest.json"
