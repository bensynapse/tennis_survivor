name: Update Daily Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest scripts.test_scoring
      - run: python scripts/fetch_history.py
      - run: python scripts/fetch_daily_jinx_settlements.py
      - run: node scripts/update_daily_jinx_leaderboard.mjs
      - run: python scripts/build_data_manifest.py
      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "Auto update daily history data"
          file_pattern: "data/history.json data/daily_jinx_settlements.json data/daily_jinx_leaderboard.json data/history/*.json data/preference/*.json data/manifest.json"
