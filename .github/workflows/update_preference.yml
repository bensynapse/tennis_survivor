name: Update Daily Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest scripts.test_scoring
      - run: python scripts/fetch_history.py
      - run: python scripts/fetch_daily_jinx_settlements.py
      - run: node scripts/update_daily_jinx_leaderboard.mjs
      - run: python scripts/build_data_manifest.py
      - uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "Auto update daily history data"
          file_pattern: "data/history.json data/daily_jinx_settlements.json data/daily_jinx_leaderboard.json data/history/*.json data/preference/*.json data/manifest.json"
